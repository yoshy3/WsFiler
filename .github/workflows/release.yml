name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  # ── バージョン抽出 ──────────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  # ── linux-x64 NativeAOT → .deb ─────────────────────────────────────────
  build-linux:
    needs: prepare
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install NativeAOT build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang zlib1g-dev libkrb5-dev

      - name: Publish NativeAOT linux-x64
        run: |
          dotnet publish src/WsFiler.App/WsFiler.App.csproj \
            -r linux-x64 \
            -c Release \
            -p:PublishAot=true \
            -p:Version=$VERSION \
            --self-contained true \
            -o publish/linux-x64

      - name: Build .deb package
        run: |
          chmod +x installer/linux/build-deb.sh
          installer/linux/build-deb.sh "$VERSION" "$(pwd)/publish/linux-x64" "$(pwd)/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/wsfiler_${{ env.VERSION }}_amd64.deb

  # ── win-x64 NativeAOT → InnoSetup .exe ─────────────────────────────────
  build-windows:
    needs: prepare
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish NativeAOT win-x64
        shell: pwsh
        run: |
          dotnet publish src/WsFiler.App/WsFiler.App.csproj `
            -r win-x64 `
            -c Release `
            -p:PublishAot=true `
            "-p:Version=$env:VERSION" `
            --self-contained true `
            -o publish\win-x64

      - name: Install InnoSetup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer with InnoSetup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $sourceDir = Resolve-Path "publish\win-x64"
          $outputDir = New-Item -ItemType Directory -Force -Path "dist" | Select-Object -ExpandProperty FullName
          & $iscc `
            "/DAppVersion=$env:VERSION" `
            "/DSourceDir=$sourceDir" `
            "/DOutputDir=$outputDir" `
            "installer\windows\WsFiler.iss"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/WsFiler-${{ env.VERSION }}-win-x64-setup.exe

  # ── osx-arm64 NativeAOT → .dmg ─────────────────────────────────────────
  build-macos:
    needs: prepare
    runs-on: macos-14
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish NativeAOT osx-arm64
        run: |
          dotnet publish src/WsFiler.App/WsFiler.App.csproj \
            -r osx-arm64 \
            -c Release \
            -p:PublishAot=true \
            -p:Version=$VERSION \
            --self-contained true \
            -o publish/osx-arm64

      - name: Build .app bundle and .dmg
        run: |
          APP_BUNDLE="dist/WsFiler.app"
          mkdir -p "$APP_BUNDLE/Contents/MacOS"
          mkdir -p "$APP_BUNDLE/Contents/Resources"

          cp -r publish/osx-arm64/* "$APP_BUNDLE/Contents/MacOS/"
          chmod +x "$APP_BUNDLE/Contents/MacOS/WsFiler.App"
          cp src/WsFiler.App/Assets/WsFiler.icns "$APP_BUNDLE/Contents/Resources/WsFiler.icns"

          cat > "$APP_BUNDLE/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>WsFiler</string>
            <key>CFBundleIdentifier</key><string>com.yoshy3.wsfiler</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleExecutable</key><string>WsFiler.App</string>
            <key>CFBundleIconFile</key><string>WsFiler</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST

          mkdir -p dist/dmg-staging
          cp -r "$APP_BUNDLE" dist/dmg-staging/
          ln -s /Applications dist/dmg-staging/Applications

          DMG_RW="dist/WsFiler-${VERSION}-osx-arm64.rw.dmg"
          DMG_FINAL="dist/WsFiler-${VERSION}-osx-arm64.dmg"
          VOLUME_NAME="WsFiler $VERSION"
          MOUNT_DIR="$(mktemp -d)"

          hdiutil create \
            -volname "$VOLUME_NAME" \
            -srcfolder dist/dmg-staging \
            -ov \
            -format UDRW \
            -fs HFS+ \
            "$DMG_RW"

          hdiutil attach "$DMG_RW" -mountpoint "$MOUNT_DIR" -nobrowse -quiet

          osascript <<APPLESCRIPT
          tell application "Finder"
            tell disk "$VOLUME_NAME"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set bounds of container window to {100, 100, 620, 360}
              set arrangement of icon view options of container window to not arranged
              set icon size of icon view options of container window to 96
              set position of item "WsFiler.app" of container window to {150, 130}
              set position of item "Applications" of container window to {370, 130}
              close
              open
              update without registering applications
              delay 1
            end tell
          end tell
          APPLESCRIPT

          hdiutil detach "$MOUNT_DIR" -quiet
          rmdir "$MOUNT_DIR"
          hdiutil convert "$DMG_RW" -format UDZO -o "$DMG_FINAL" -ov
          rm "$DMG_RW"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/WsFiler-${{ env.VERSION }}-osx-arm64.dmg

  # ── 通常 Release ビルド → .zip ──────────────────────────────────────────
  build-zip:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish framework-dependent Release build
        run: |
          dotnet publish src/WsFiler.App/WsFiler.App.csproj \
            -c Release \
            -p:Version=$VERSION \
            -o publish/WsFiler

      - name: Create zip archive
        run: |
          mkdir -p dist
          cd publish
          zip -r "../dist/WsFiler-${VERSION}-any.zip" WsFiler/

      - uses: actions/upload-artifact@v4
        with:
          name: zip-release
          path: dist/WsFiler-${{ env.VERSION }}-any.zip

  # ── GitHub Release 作成 ────────────────────────────────────────────────
  release:
    needs: [prepare, build-linux, build-windows, build-macos, build-zip]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "WsFiler $VERSION" \
            --generate-notes \
            "release-assets/linux-deb/wsfiler_${VERSION}_amd64.deb" \
            "release-assets/windows-installer/WsFiler-${VERSION}-win-x64-setup.exe" \
            "release-assets/macos-dmg/WsFiler-${VERSION}-osx-arm64.dmg" \
            "release-assets/zip-release/WsFiler-${VERSION}-any.zip"
